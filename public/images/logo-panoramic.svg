<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="warmGradOG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF14A" />
      <stop offset="30%" stop-color="#FFD400" />
      <stop offset="65%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF3005" />
    </linearGradient>
    <linearGradient id="blueGradOG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#024EFF" />
      <stop offset="100%" stop-color="#8F94FF" />
    </linearGradient>
    <filter id="glowOG">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="630" fill="#000000" />
  
  <!-- Glowing Background Curves -->
  <path d="M-100,500 Q300,100 1300,450" stroke="url(#blueGradOG)" stroke-width="6" fill="none" opacity="0.4" filter="url(#glowOG)" />
  <path d="M-100,200 Q600,600 1300,150" stroke="url(#warmGradOG)" stroke-width="4" fill="none" opacity="0.5" filter="url(#glowOG)" />

  <!-- Logo Round Container on Left -->
  <g transform="translate(260, 315)">
    <circle cx="0" cy="0" r="180" fill="#0A0B14" stroke="url(#warmGradOG)" stroke-width="8" filter="url(#glowOG)" />
    <ellipse cx="0" cy="0" rx="140" ry="50" stroke="url(#blueGradOG)" stroke-width="5" fill="none" />
    <text x="0" y="30" font-family="'Urbanist', 'Arial Black', sans-serif" font-weight="900" font-size="75" fill="url(#warmGradOG)" text-anchor="middle">
      360<tspan fill="url(#blueGradOG)">∞</tspan>
    </text>
  </g>

  <!-- Text & Branding on Right -->
  <g transform="translate(540, 240)">
    <text x="0" y="0" font-family="'Urbanist', sans-serif" font-weight="900" font-size="80" fill="url(#warmGradOG)" filter="url(#glowOG)" letter-spacing="2">
      MAGIC <tspan fill="#FFFFFF">360</tspan>
    </text>
    <text x="0" y="65" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="32" fill="#8F94FF" letter-spacing="3">
      ALQUILER DE CABINA 360º
    </text>
    <text x="0" y="120" font-family="'Inter Tight', sans-serif" font-weight="500" font-size="26" fill="#B9BCC8">
      Alicante · Bodas, Cumpleaños y Empresa
    </text>
    <rect x="0" y="150" width="320" height="50" rx="25" fill="url(#warmGradOG)" />
    <text x="160" y="183" font-family="'Urbanist', sans-serif" font-weight="800" font-size="20" fill="#000000" text-anchor="middle" letter-spacing="1">
      DESDE 140 € · VÍDEOS ILIMITADOS
    </text>
  </g>
</svg>
