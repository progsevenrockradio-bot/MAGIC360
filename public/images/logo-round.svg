<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Warm Gradient -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF14A" />
      <stop offset="30%" stop-color="#FFD400" />
      <stop offset="65%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF3005" />
    </linearGradient>
    <!-- Blue Electric Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#024EFF" />
      <stop offset="100%" stop-color="#8F94FF" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle (Pure Black) -->
  <circle cx="250" cy="250" r="240" fill="#000000" />

  <!-- Outer Neon Rings -->
  <circle cx="250" cy="250" r="230" stroke="url(#blueGrad)" stroke-width="4" fill="none" opacity="0.6" />
  <circle cx="250" cy="250" r="222" stroke="url(#warmGrad)" stroke-width="5" fill="none" filter="url(#neonGlow)" />

  <!-- 360 Camera Platform Symbol -->
  <g transform="translate(250, 190)">
    <!-- Rotating Arm Circle -->
    <ellipse cx="0" cy="30" rx="90" ry="32" stroke="url(#blueGrad)" stroke-width="4" fill="none" opacity="0.8" />
    <ellipse cx="0" cy="30" rx="90" ry="32" stroke="url(#warmGrad)" stroke-width="3" stroke-dasharray="25 15" fill="none" />
    
    <!-- Platform Base -->
    <ellipse cx="0" cy="45" rx="55" ry="18" fill="#0A0B14" stroke="url(#warmGrad)" stroke-width="3" />
    
    <!-- Camera Icon on Arm -->
    <g transform="translate(65, 0)">
      <rect x="-15" y="-12" width="30" height="22" rx="4" fill="url(#warmGrad)" />
      <circle cx="0" cy="-1" r="6" fill="#000000" stroke="#FFF14A" stroke-width="2" />
      <polygon points="-5,-12 0,-17 5,-12" fill="#FF9500" />
    </g>
  </g>

  <!-- Central Brand Text -->
  <text x="250" y="315" font-family="'Urbanist', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="url(#warmGrad)" text-anchor="middle" letter-spacing="2" filter="url(#neonGlow)">
    MAGIC <tspan fill="#FFFFFF">360</tspan><tspan fill="url(#blueGrad)">∞</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="250" y="360" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="16" fill="#8F94FF" text-anchor="middle" letter-spacing="5">
    ALICANTE
  </text>
</svg>
